// Ältere Stände um neue Felder ergänzen
function normalize(x){
  x.settings = Object.assign({...DEF_SET}, x.settings||{});
  x.articles.forEach(a=>{ if(!Number.isFinite(a.stock)) a.stock=0; if(a.img===undefined) a.img=null; if(a.active===undefined) a.active=true; });

  // Ältere Bestellungen: deren gedruckte, unbezahlte Stücke gelten als schon übergeben (legacy), Lager bleibt unverändert.
  x.orders.forEach(o=>{ if(!Number.isFinite(o.inStock)){ o.inStock=0; o.legacy=Math.max(0,(o.printed||0)-(o.paid||0)); } if(!Number.isFinite(o.legacy)) o.legacy=0; delete o.fromStock; });

function info(o){
  const a = art(o.nr);
  const u = o.manual!=null ? o.manual : (a ? usedPrice(a) : null);
  const ok = u!=null && !Number.isNaN(u);
  return { a, u, ok,
    toPrint: Math.max(0,o.qty-o.printed),
    billable: Math.max(0,Math.min(o.printed,o.qty)-o.paid),
    open: ok ? Math.max(0,o.qty-o.paid)*u : 0,
    sum: ok ? o.qty*u : 0, got: ok ? o.paid*u : 0,
    done: o.printed>=o.qty && o.paid>=o.qty };
}
function richtwert(a){
  if(!a || a.calc==null || a.S==null || a.N==null || a.O==null) return null;
  if(usedPrice(a)!==a.calc) return null;
  const s=S.settings, raw=a.S - SAVE_RATE*(a.N+a.O)*(1+s.gewinn);
  return Math.ceil(Math.max(0,raw)/s.runden - 1e-9)*s.runden;
}

const imgMem = {}, imgLoading = {};
function imgKey(a){ return a && a.img ? a.nr+':'+a.img : null; }
function cachedImg(k){
  if(imgMem[k]) return imgMem[k];
  try{ const c=JSON.parse(localStorage.getItem('ci:'+k.split(':')[0])||'null'); if(c && c.k===k){ imgMem[k]=c.d; return c.d; } }catch(e){}
  return null;
}
function storeImg(k,d){ imgMem[k]=d; try{ localStorage.setItem('ci:'+k.split(':')[0], JSON.stringify({k,d})); }catch(e){} }
function thumb(a, cls){
  const k = imgKey(a), c = cls||'';
  if(k){ const d=cachedImg(k); return `<img class="th ${c}" alt="" data-img="${k}"${d?` src="${d}"`:''}>`; }
  const ch = a ? (a.name||'?').trim().charAt(0).toUpperCase() : '?';
  return `<div class="th ${c}">${esc(ch)}</div>`;
}
function hydrateImgs(){
  document.querySelectorAll('img[data-img]:not([src])').forEach(el=>{
    const k=el.dataset.img, d=cachedImg(k);
    if(d){ el.src=d; return; }
    if(imgLoading[k] || !live) return;
    imgLoading[k]=true;
    call('getImage', k.split(':')[0]).then(data=>{
      if(data){ storeImg(k,data); document.querySelectorAll(`img[data-img="${k}"]`).forEach(e=>e.src=data); }
    }).catch(()=>{}).finally(()=>{ setTimeout(()=>{ delete imgLoading[k]; }, 30000); });
  });
}
// Foto verkleinern (max. 320 px, JPEG) → data-URL
function readImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const max=320, s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.max(1,Math.round(img.naturalWidth*s)), h=Math.max(1,Math.round(img.naturalHeight*s));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      let q=0.75, d=c.toDataURL('image/jpeg',q);
      while(d.length>45000 && q>0.3){ q-=0.1; d=c.toDataURL('image/jpeg',q); }
      d.length>45000 ? rej(new Error('Bild zu groß')) : res(d);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Bild konnte nicht gelesen werden')); };
    img.src=url;
  });
}

let demoDb = null;
function demoCall(fn, args){
  if(!demoDb){ try{ demoDb=JSON.parse(localStorage.getItem('demoDb')||'null'); }catch(e){} demoDb=demoDb||{state:null,img:{}}; }
  const save=()=>{ try{ localStorage.setItem('demoDb',JSON.stringify(demoDb)); }catch(e){} };
  return new Promise(r=>setTimeout(()=>{
    if(fn==='getState') return r(demoDb.state);
    if(fn==='getImage') return r(demoDb.img[args[0]]||null);
    if(fn==='saveImage'){ demoDb.img[args[0]]=args[1]; save(); return r({ok:true}); }
    if(fn==='saveState'){
      const inc=JSON.parse(args[0]), st=demoDb.state?JSON.parse(demoDb.state):null, sr=st?st.rev||0:0;
      if(st && sr>Number(args[1]||0)) return r({ok:false,conflict:true,state:demoDb.state});
      inc.rev=Math.max(Date.now(),sr+1); demoDb.state=JSON.stringify(inc); save(); return r({ok:true,rev:inc.rev});
    }
  },120));
}
async function apiGet(params){
  const r = await fetch(API_URL+'?'+new URLSearchParams(params), {credentials:'omit', cache:'no-store'});
  const j = await r.json(); if(!j.ok) throw new Error(j.error||'Serverfehler'); return j;
}
async function apiPost(body){
  const r = await fetch(API_URL, {method:'POST', credentials:'omit', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  return r.json();
}
function call(fn, ...args){
  if(DEMO) return demoCall(fn, args);
  if(hasGas()) return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  if(fn==='getState') return apiGet({a:'state'}).then(j=>j.state);
  if(fn==='getImage') return apiGet({a:'img',k:args[0]}).then(j=>j.data);
  if(fn==='saveState') return apiPost({a:'save',json:args[0],baseRev:args[1]});
  if(fn==='saveImage') return apiPost({a:'img',k:args[0],data:args[1]});
  return Promise.reject(new Error('unbekannt'));
}
/* ----- Gleichzeitiges Arbeiten: Zusammenführen statt Überschreiben -----
   BASE = letzter Stand vom Server, auf dem die eigenen Änderungen beruhen.
   Bei einem Konflikt wird (BASE, eigener Stand, Server-Stand) je Bestellung/Artikel/Kommission und Feld zusammengeführt:
   nur eine Seite geändert → diese gilt; beide geändert → Zähler (gedruckt, bezahlt, Lager …) werden addiert, sonst gilt die eigene Änderung. */
const LKEY = DEMO?'cockpit3d-demo':'cockpit3d';
let BASE=null;
const clone = x => JSON.parse(JSON.stringify(x));
const same = (a,b) => JSON.stringify(a)===JSON.stringify(b);
const COUNTERS = new Set(['printed','paid','stock','sold','returned','inStock','legacy']);
function setBase(x){ BASE=clone(x); try{ localStorage.setItem(LKEY+'-base', JSON.stringify(BASE)); }catch(e){} }
function mergeObj(b,l,r){
  const out={...r};
  for(const k of new Set([...Object.keys(l),...Object.keys(r)])){
    const bv=b?b[k]:undefined, lv=l[k], rv=r[k];
    if(same(lv,bv)) out[k]=rv;                                                                   // nur drüben geändert
    else if(COUNTERS.has(k) && [bv,lv,rv].every(v=>typeof v==='number')) out[k]=Math.max(0,rv+(lv-bv)); // Zähler: eigene Änderung dazurechnen
    else out[k]=lv;                                                                              // sonst gilt die eigene Änderung
  }
  return out;
}
function mergeList(b,l,r,key){
  const mb=new Map((b||[]).map(x=>[x[key],x])), ml=new Map(l.map(x=>[x[key],x])), mr=new Map(r.map(x=>[x[key],x]));
  const out=[];
  for(const id of [...new Set([...r.map(x=>x[key]),...l.map(x=>x[key])])]){
    const bx=mb.get(id), lx=ml.get(id), rx=mr.get(id);
    if(lx&&rx) out.push(bx?mergeObj(bx,lx,rx):lx);
    else if(lx) { if(!bx || !same(lx,bx)) out.push(lx); }      // neu hier – oder drüben gelöscht, hier aber geändert
    else if(rx) { if(!bx || !same(rx,bx)) out.push(rx); }      // neu drüben – oder hier gelöscht, drüben aber geändert
  }
  return out;
}
function mergeState(b, l, r){
  b=b||{articles:[],orders:[],consign:[],moves:[],settings:{}}; l=clone(l); r=clone(r);
  // Gleiche Artikelnummer auf beiden Seiten neu vergeben → eigenen Artikel umnummerieren
  const bn=new Set(b.articles.map(a=>a.nr)), rmap=new Map(r.articles.map(a=>[a.nr,a]));
  let maxNr=Math.max(0,...l.articles.map(a=>a.nr),...r.articles.map(a=>a.nr));
  for(const a of l.articles){
    if(bn.has(a.nr) || !rmap.has(a.nr) || same(a,rmap.get(a.nr))) continue;
    const old=a.nr, nu=++maxNr; a.nr=nu;
    l.orders.forEach(o=>{ if(o.nr===old && !b.orders.some(x=>x.id===o.id)) o.nr=nu; });
    l.consign.forEach(c=>{ if(c.nr===old && !b.consign.some(x=>x.id===c.id)) c.nr=nu; });
    (l.moves||[]).forEach(m=>{ if(m.nr===old && !(b.moves||[]).some(x=>x.d===m.d&&x.w===m.w)) m.nr=nu; });
    if(a.img){ const d=cachedImg(old+':'+a.img); if(d){ storeImg(nu+':'+a.img,d); call('saveImage',String(nu),d).catch(()=>{}); } }
  }
  const m={...r};
  m.settings=mergeObj(b.settings||{}, l.settings||{}, r.settings||{});
  m.articles=mergeList(b.articles,l.articles,r.articles,'nr');
  m.orders=mergeList(b.orders,l.orders,r.orders,'id');
  m.consign=mergeList(b.consign||[],l.consign||[],r.consign||[],'id');
  const mk=x=>x.d+'|'+x.nr+'|'+x.n+'|'+x.w, seen=new Set();
  m.moves=[...(r.moves||[]),...(l.moves||[])].filter(x=>{ const k=mk(x); if(seen.has(k)) return false; seen.add(k); return true; })
    .sort((x,y)=>y.d.localeCompare(x.d)).slice(0,200);
  m.rev=r.rev; m.appBuild=Math.max(l.appBuild||0, r.appBuild||0);
  return normalize(m);
}

function adopt(x){ S=normalize(x); setBase(S); saveLocal(); }
function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(S)); }catch(e){} }
function persist(){ saveLocal(); dirty=true; flush(); }
async function flush(){
  if(!live || saving || !dirty) return;
  saving=true; dirty=false;
  try{
    if((S.appBuild||0)<APP_BUILD) S.appBuild=APP_BUILD;   // zeigt älteren Geräten: es gibt eine neuere Version
    const sent=JSON.stringify(S);
    const r = await call('saveState', sent, S.rev||0);
    if(r && r.ok){ S.rev=r.rev; const s=JSON.parse(sent); s.rev=r.rev; setBase(s); saveLocal(); }
    else if(r && r.conflict){
      const remote=normalize(JSON.parse(r.state));
      S=mergeState(BASE, S, remote); setBase(remote); saveLocal();
      dirty=true;                                   // zusammengeführten Stand gleich speichern
      if(!busy()) render();
    }
    else toast('Speichern fehlgeschlagen: '+((r&&r.error)||'unbekannt'), true);
  }catch(e){
    dirty=true; live=false; setStatus(); toast('Keine Verbindung. Änderung nur auf diesem Gerät gespeichert.', true);
  }finally{ saving=false; }
  if(dirty) flush();
}
function toast(msg, bad){
  const t=$('#toast'); t.textContent=msg; t.className='toast'+(bad?' bad':''); t.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none', bad?4000:2400);
}
function setStatus(){
  $('#dot').className='dot'+(live?' on':'');
  const day=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  $('#status').textContent=(DEMO?'TESTMODUS · ':'')+(live?day:'Offline – Änderungen nur auf diesem Gerät');
}

/* ================= Lager ================= */
// a.stock = alle Stücke, die physisch da sind. Davon für Bestellungen reserviert = gedruckt, aber noch nicht bezahlt/abgeholt.
const reserved = a => S.orders.reduce((s,o)=>s+(o.nr===a.nr?(o.inStock||0):0),0);
const freeStock = a => Math.max(0,(a.stock||0)-reserved(a));
const inKomm = a => S.consign.reduce((s,c)=>s+(c.nr===a.nr?Math.max(0,c.qty-c.sold-c.returned):0),0);
function logMove(nr, n, why){ if(!n) return; S.moves.unshift({d:new Date().toISOString(),nr,n,w:why}); if(S.moves.length>200) S.moves.length=200; }
function moveRows(list){
  return list.length?list.map(m=>{ const a=art(m.nr), dt=new Date(m.d); return `<div class="li">${thumb(a,'sm')}<div class="t"><b>${esc(a?a.name:'Artikel '+m.nr)}</b><small>${esc(m.w)} · ${dt.toLocaleDateString('de-DE')} ${dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</small></div><b style="color:${m.n>0?'var(--ok)':'var(--bad)'}">${m.n>0?'+':'−'}${Math.abs(m.n)}</b></div>`; }).join(''):'<div class="empty">Noch keine Lagerbewegungen</div>';
}
// Gedruckt/bezahlt ändern und Lager mitführen: gedruckt → ins Lager, bezahlt (= abgeholt) → aus dem Lager
function setPP(o, pr, pd){
  const a=art(o.nr), sum={};
  const add=(n,why)=>{ if(a) a.stock=Math.max(0,(a.stock||0)+n); sum[why]=(sum[why]||0)+n; };
  while(o.printed<pr){ o.printed++; o.inStock++; add(1,'Gedruckt für Bestellung'); }
  while(o.printed>pr){ const held=o.printed>o.paid; o.printed--; if(held){ if(o.inStock>0){ o.inStock--; add(-1,'„Gedruckt“ zurückgenommen'); } else if(o.legacy>0) o.legacy--; } }
  while(o.paid<pd){ const held=o.printed>o.paid; o.paid++; if(held){ if(o.legacy>0) o.legacy--; else if(o.inStock>0){ o.inStock--; add(-1,'Bezahlt/abgeholt'); } } }
  while(o.paid>pd){ o.paid--; if(Math.max(0,o.printed-o.paid)>o.inStock+o.legacy){ o.inStock++; add(1,'„Bezahlt“ zurückgenommen'); } }
  Object.keys(sum).forEach(w=>logMove(o.nr,sum[w],w+' – '+o.buyer));
}
// Neue Bestellung: freie Stücke aus dem Lager für die Bestellung reservieren (zählen als gedruckt)
function takeFromStock(o){
  const a=art(o.nr); if(!a) return 0;
  const take=Math.min(freeStock(a), o.qty);
  o.printed=take; o.inStock=take; o.legacy=0;
  return take;
}

/* ----- Kommission ----- */
function cInfo(c){ const out=Math.max(0,c.qty-c.sold-c.returned); return {out, due:Math.max(0,c.sold-c.paid)*(c.price||0), done:out===0&&c.paid>=c.sold}; }
function kommSums(){ return S.consign.reduce((t,c)=>{ const i=cInfo(c); t.out+=i.out; t.due+=i.due; return t; },{out:0,due:0}); }
function vKomm(){
  const k=kommSums();
  const list=S.consign.filter(c=>kommFilter==='alle'||!cInfo(c).done);
  const groups={}; list.forEach(c=>{ (groups[c.person]=groups[c.person]||[]).push(c); });
  let h=`<div class="kpis"><div class="kpi"><span>Unterwegs</span><b>${k.out} Stk.</b></div><div class="kpi hot"><span>Noch zu bekommen</span><b>${EUR(k.due)}</b></div></div>

// Kalkulation (Formeln wie in der Original-Tabelle; Minuten werden berücksichtigt)
function kalk(useMin){
  const g=id=>num($('#'+id).value), s=S.settings;
  const raw=[g('r_roll'),g('r_inh'),g('r_fil'),g('r_std'),g('r_min'),g('r_zn'),g('r_zp'),g('r_nach'),g('r_son')];
  if(raw.some(v=>v!==null&&Number.isNaN(v))) return {err:'Bitte nur Zahlen eingeben.'};
  const [roll,inhIn,fil0,std0,min0,zn0,zp0,nach0,son0]=raw;
  if(roll==null) return {err:'Rollenpreis eingeben.'};
  const inh=inhIn||s.rolle, fil=fil0||0, std=std0||0, min=min0||0, zn=zn0||0, zp=zp0||0, nach=nach0||0, son=son0||0;
  if(inh<=0) return {err:'Rolleninhalt muss größer als 0 sein.'};
  const h=std+(useMin===false?0:min/60);
  const mat=roll/inh*fil*(1+s.ausschuss), zus=zn*zp, strom=h*s.strom*s.watt/1000, vers=h*s.verschl, arb=nach/60*s.arbeit;
  const selb=mat+zus+strom+vers+arb+son, kal=selb*(1+s.gewinn), rund=Math.ceil(kal/s.runden-1e-9)*s.runden;
  return {h,min,mat,zus,strom,vers,arb,son,selb,kal,rund};
}
function updCalc(){
  const out=$('#r_out'); if(!out) return;
  const r=kalk(); if(r.err){ out.innerHTML=`<span class="muted">${r.err}</span>`; return; }
  let h=`<table>
    <tr><td>Material inkl. Ausschuss</td><td class="r">${EUR(r.mat)}</td></tr><tr><td>Zusatzteile</td><td class="r">${EUR(r.zus)}</td></tr>
    <tr><td>Strom (${r.h.toFixed(2).replace('.',',')} Std.)</td><td class="r">${EUR(r.strom)}</td></tr><tr><td>Verschleiß</td><td class="r">${EUR(r.vers)}</td></tr>
    <tr><td>Arbeit</td><td class="r">${EUR(r.arb)}</td></tr><tr><td>Sonstiges</td><td class="r">${EUR(r.son)}</td></tr>
    <tr><td><b>Selbstkosten</b></td><td class="r"><b>${EUR(r.selb)}</b></td></tr><tr><td>Kalkuliert (inkl. Gewinn)</td><td class="r">${EUR(r.kal)}</td></tr>
    <tr><td><b>Verkaufspreis gerundet</b></td><td class="r"><span class="big-num" style="font-size:20px">${EUR(r.rund)}</span></td></tr></table>`;
  if(r.min>0){ const o=kalk(false); h+=`<div class="warn" style="margin-top:6px">Hinweis: Die Tabelle berücksichtigt Minuten bei Strom und Verschleiß bisher nicht. Ohne Minuten wäre der Preis ${EUR(o.rund)}. Hier werden die Minuten genutzt.</div>`; }
  out.innerHTML=h;
}

}

/* ----- Sicherung ----- */
function download(blob, name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function csv(rows){ return '﻿'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\r\n'); }
function backup(kind){
  const d=today();
  if(kind==='json') return download(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}), `3D-Druck-Sicherung-${d}.json`);
  if(kind==='o'){
    const rows=[['Datum','Besteller','Artikel-Nr.','Artikel','Variante','Menge','Gedruckt','Bezahlt','Stückpreis','Summe','Offen','Bereit im Lager','Notiz']];
    S.orders.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(o=>{ const i=info(o); rows.push([fmtDate(o.date),o.buyer,o.nr,i.a?i.a.name:'',o.variant,o.qty,o.printed,o.paid,i.ok?dec(i.u):'',i.ok?dec(i.sum):'',dec(i.open),o.inStock||0,o.note]); });
    return download(new Blob([csv(rows)],{type:'text/csv'}), `3D-Druck-Bestellungen-${d}.csv`);
  }
  const rows=[['Nr.','Name','Variante','Verkaufspreis','Kalkuliert','Manuell','Lager','Aktiv','Notiz']];
  S.articles.slice().sort((a,b)=>a.nr-b.nr).forEach(a=>rows.push([a.nr,a.name,a.variant,usedPrice(a)!=null?dec(usedPrice(a)):'',a.calc!=null?dec(a.calc):'',a.manual!=null?dec(a.manual):'',a.stock||0,a.active?'ja':'nein',a.note]));
  download(new Blob([csv(rows)],{type:'text/csv'}), `3D-Druck-Artikel-${d}.csv`);
}

/* ================= Aktionen ================= */
function act(name, el){
  const d=el.dataset, o=d.id?S.orders.find(x=>x.id===d.id):null;
  switch(name){
    case 'pr+': if(o&&o.printed<o.qty){ setPP(o,o.printed+1,o.paid); persist(); render(); toast('Gedruckt – liegt jetzt im Lager bereit'); } break;
    case 'pr-': if(o&&o.printed>0){ setPP(o,o.printed-1,o.paid); persist(); render(); } break;
    case 'pd+': if(o&&o.paid<o.qty){ const held=o.printed>o.paid; setPP(o,o.printed,o.paid+1); persist(); render(); if(held) toast('Bezahlt – aus dem Lager abgebucht'); } break;
    case 'pd-': if(o&&o.paid>0){ setPP(o,o.printed,o.paid-1); persist(); render(); } break;
    case 'st+': case 'st-': { const a=art(d.id); if(!a) break;
      if(name==='st-' && (a.stock||0)<=reserved(a)) return toast('Die restlichen Stücke sind für Bestellungen reserviert', true);
      const before=a.stock||0; a.stock=Math.max(0,before+(name==='st+'?1:-1)); logMove(a.nr,a.stock-before,'Von Hand korrigiert'); persist();
      const q=$('#lq'); $('#lagerlist').innerHTML=lagerRows(S.articles.filter(x=>lagerFilter==='alle'?x.active||(x.stock||0)>0:(x.stock||0)>0).sort((x,y)=>byName(x.name,y.name)), q?q.value:''); hydrateImgs(); break; }
    case 'nq+': newQty++; $('#view').querySelector('[data-act="nq-"]').parentElement.outerHTML=stepper('nq','x',newQty,null,1); updNeu(); break;
    case 'nq-': if(newQty>1){ newQty--; $('#view').querySelector('[data-act="nq-"]').parentElement.outerHTML=stepper('nq','x',newQty,null,1); updNeu(); } break;
    case 'lf': lagerFilter=d.v; render(); break;
    case 'lm': lagerMode=d.v; render(); break;
    case 'kf': kommFilter=d.v; render(); break;
    case 'komm-new': openKommNew(); break;
    case 'pick-komm': openPicker('Artikel mitgeben', articleItems(true), v=>{ mNr=v; $('#k_art').innerHTML=artPickBtn(v,'pick-komm'); const a=art(v); const p=$('#k_price'); if(p&&!p.value&&usedPrice(a)!=null) p.value=dec(usedPrice(a)); updKommHint(); hydrateImgs(); }); break;
    case 'mq+': case 'mq-': { if(name==='mq+') mQty++; else if(mQty>1) mQty--; const box=$('#k_qty')||$('#p_qty'); if(box) box.innerHTML=stepper('mq','x',mQty,null,1); updKommHint(); break; }
    case 'komm-save': saveKomm(); break;
    case 'print-stock': openPrintStock(); break;
    case 'print-save': { const a=art(mNr); if(!a) break; a.stock=(a.stock||0)+mQty; logMove(a.nr,mQty,'Gedruckt fürs Lager'); persist(); closeModal(); render(); toast(mQty+' Stk. „'+a.name+'“ ins Lager gebucht'); break; }
    case 'ks+': case 'ks-': case 'kr+': case 'kr-': case 'kp+': case 'kp-': case 'kr-rest': {
      const c=S.consign.find(x=>x.id===d.id); if(!c) break; const a=art(c.nr), free=c.qty-c.sold-c.returned;
      if(name==='ks+'){ if(free<=0) return toast('Alle Stücke sind schon verkauft oder zurück', true); c.sold++; }
      if(name==='ks-'){ if(c.sold<=0) break; c.sold--; c.paid=Math.min(c.paid,c.sold); }
      if(name==='kr+'){ if(free<=0) return toast('Alle Stücke sind schon verkauft oder zurück', true); c.returned++; if(a) a.stock=(a.stock||0)+1; logMove(c.nr,1,'Zurück von '+c.person); }
      if(name==='kr-'){ if(c.returned<=0) break; if(!a||(a.stock||0)<1) return toast('Das Stück ist nicht mehr im Lager', true); c.returned--; a.stock--; logMove(c.nr,-1,'Rückgabe korrigiert – '+c.person); }
      if(name==='kr-rest'){ if(free<=0) break; c.returned+=free; if(a) a.stock=(a.stock||0)+free; logMove(c.nr,free,'Rest zurück von '+c.person); toast(free+' Stk. zurück im Lager'); }
      if(name==='kp+'){ if(c.paid>=c.sold) return toast('Erst als verkauft markieren', true); c.paid++; }
      if(name==='kp-'){ if(c.paid<=0) break; c.paid--; }
      persist(); render(); break;
    }
    case 'komm-edit-save': { const c=S.consign.find(x=>x.id===d.id); if(!c) break; const p=$('#ke_person').value.trim(), pr=num($('#ke_price').value);
      if(!p) return toast('Name fehlt', true); if(pr==null||Number.isNaN(pr)||pr<0) return toast('Preis ungültig', true);
      Object.assign(c,{person:p,price:pr,date:$('#ke_date').value||c.date,note:$('#ke_note').value.trim()}); persist(); closeModal(); render(); toast('Gespeichert'); break; }
    case 'komm-del': if(!delArmed){ delArmed=true; el.textContent='Wirklich löschen?'; } else { const c=S.consign.find(x=>x.id===d.id); if(c){ const a=art(c.nr), back=c.qty-c.sold-c.returned; if(a&&back>0){ a.stock=(a.stock||0)+back; logMove(c.nr,back,'Kommission gelöscht – '+c.person); } S.consign=S.consign.filter(x=>x.id!==c.id); } persist(); closeModal(); render(); toast('Gelöscht'); } break;
    case 'af': artFilter=d.v; render(); break;
    case 'pick-new': openPicker('Artikel wählen', articleItems(true), v=>{ newNr=v; const btn=$('[data-act="pick-new"]'); if(btn) btn.outerHTML=artPickBtn(newNr,'pick-new'); const a=art(v); $('#f_var').value=a?a.variant||'':''; updNeu(); hydrateImgs(); }); break;
    case 'pick-edit': openPicker('Artikel wählen', articleItems(false), v=>{ editNr=v; $('#e_art').innerHTML=artPickBtn(v,'pick-edit'); hydrateImgs(); }); break;
    case 'pick-buyer': openPicker('Besteller wählen', payBuyers().map(b=>({value:b,label:b,sub:'',thumb:`<div class="th">${esc(b.charAt(0).toUpperCase())}</div>`,search:b.toLowerCase()})), v=>{ selBuyer=v; paySel={}; render(); }); break;
    case 'picker-close': closePicker(); break;
    case 'edit-save': saveEdit(d.id); break;
    case 'edit-del': if(!delArmed){ delArmed=true; el.textContent='Wirklich löschen?'; } else { S.orders=S.orders.filter(x=>x.id!==d.id); persist(); closeModal(); render(); toast(o.inStock?'Gelöscht – '+o.inStock+' gedruckte Stk. bleiben frei im Lager':'Bestellung gelöscht'); } break;
    case 'modal-close': closeModal(); break;
    case 'save-new': saveNew(); break;
    case 'richtwert': $('#f_manual').value=d.v; updNeu(); break;
    case 'copy-pay': { const it=selectedItems(selBuyer); if(!it.length) return toast('Keine Positionen ausgewählt', true); copyText(statement(selBuyer,it)); break; }
    case 'mark-paid': { const it=selectedItems(selBuyer); if(!it.length) return toast('Keine Positionen ausgewählt', true); it.forEach(({o,i})=>{ setPP(o,o.printed,Math.min(o.qty,o.paid+i.billable)); }); paySel={}; persist(); render(); toast('Als bezahlt markiert'); break; }
    case 'pay-all': S.orders.filter(x=>x.buyer===d.buyer).forEach(x=>{ setPP(x,x.printed,Math.max(x.paid,Math.min(x.qty,x.printed))); }); persist(); render(); toast('Als bezahlt markiert: '+d.buyer); break;
    case 'art-save': saveArt(Number(d.nr), el); break;
    case 'art-new': openArtNew(); break;
    case 'art-new-save': saveArtNew(el); break;
    case 'calc-new': calcNew(el).catch(e=>calcMsg('Fehler: '+e.message, true)); break;
    case 'app-update': (async()=>{ try{ const rs=await navigator.serviceWorker?.getRegistrations?.(); for(const r of (rs||[])) await r.update(); const ks=await caches?.keys?.(); for(const k of (ks||[])) await caches.delete(k); }catch(e){} location.reload(); })(); break;
    case 'backup-json': backup('json'); toast('Sicherung wird heruntergeladen'); break;
    case 'backup-csv-o': backup('o'); toast('Tabelle wird heruntergeladen'); break;
    case 'backup-csv-a': backup('a'); toast('Tabelle wird heruntergeladen'); break;
    case 'photo-del': pendingImg[d.t]=''; rerenderPhoto(d.t); break;
    case 'sugg': { const inp=$('#'+(d.t||'f_buyer')); if(inp) inp.value=d.v; el.parentElement.style.display='none'; break; }
    case 'settings-save': {
      const g=id=>num($('#'+id).value);
      const v={rolle:g('s_rolle'),strom:g('s_strom'),watt:g('s_watt'),verschl:g('s_verschl'),arbeit:g('s_arbeit'),ausschuss:(g('s_ausschuss')||0)/100,gewinn:(g('s_gewinn')||0)/100,runden:g('s_runden')};
      if(Object.values(v).some(x=>x==null||Number.isNaN(x)||x<0)||!(v.runden>0)||!(v.rolle>0)) return toast('Bitte alle Einstellungen als gültige Zahlen eintragen', true);
      S.settings=v; persist(); render(); toast('Einstellungen gespeichert'); break;
    }
  }
}
function rerenderPhoto(t){
  const input=document.querySelector(`[data-photo="${t}"]`); if(!input) return;
  const box=input.closest('.photo'); const lab=box.previousElementSibling;
  const a = t==='edit' ? art(Number(($('[data-act="art-save"]')||{dataset:{}}).dataset.nr)) : null;
  const tmp=document.createElement('div'); tmp.innerHTML=photoField(t,a);
  lab.remove(); box.replaceWith(...tmp.childNodes); hydrateImgs();
}

document.addEventListener('click', e=>{
  const nb=e.target.closest('#nav [data-tab]');
  if(nb){ tab=nb.dataset.tab; render(); window.scrollTo(0,0); return; }
  const pk=e.target.closest('[data-pick]');
  if(pk && pick){ const it=pick.items[Number(pk.dataset.pick)], cb=pick.onPick; closePicker(); cb(it.value); return; }
  const ab=e.target.closest('[data-act]');
  if(ab && !ab.disabled){ try{ act(ab.dataset.act, ab); }catch(err){ toast('Fehler: '+err.message, true); } return; }
  const ar=e.target.closest('[data-art]'); if(ar){ openArt(Number(ar.dataset.art)); return; }
  const km=e.target.closest('[data-komm]'); if(km){ openKommEdit(km.dataset.komm); return; }
  const ed=e.target.closest('[data-edit]'); if(ed){ openEdit(ed.dataset.edit); return; }
  if(e.target.id==='picker') closePicker();
  if(!e.target.closest('.sugg')){ document.querySelectorAll('.sugg-list').forEach(s=>s.style.display='none'); }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='q'){ $('#artlist').innerHTML=artRows(t.value); hydrateImgs(); return; }
  if(t.id==='lq'){ $('#lagerlist').innerHTML=lagerRows(S.articles.filter(x=>lagerFilter==='alle'?x.active||(x.stock||0)>0:(x.stock||0)>0).sort((x,y)=>byName(x.name,y.name)), t.value); hydrateImgs(); return; }
  if(t.id==='pk_q'){ renderPick(t.value); return; }
  if(t.id==='f_buyer' || t.id==='k_person'){
    const q=t.value.trim().toLowerCase(), l=$(t.id==='f_buyer'?'#f_sugg':'#k_sugg');
    const pool=[...new Set([...buyers(), ...S.consign.map(c=>c.person)])].sort(byName);
    const m=q?pool.filter(b=>b.toLowerCase().includes(q)&&b.toLowerCase()!==q).slice(0,8):[];
    l.innerHTML=m.map(b=>`<button data-act="sugg" data-t="${t.id}" data-v="${esc(b)}">${esc(b)}</button>`).join(''); l.style.display=m.length?'block':'none'; return;
  }
  if(t.closest('#calc')){ updCalc(); return; }
  if(tab==='neu' && t.closest('#view')) updNeu();
});
document.addEventListener('change', async e=>{
  const t=e.target;
  if(t.dataset && t.dataset.pay){ paySel[t.dataset.pay]=t.checked; render(); return; }
  if(t.dataset && t.dataset.photo && t.files && t.files[0]){
    const target=t.dataset.photo, file=t.files[0]; t.value='';
    try{ pendingImg[target]=await readImage(file); rerenderPhoto(target); toast('Foto übernommen – zum Speichern unten auf „Speichern“ bzw. „Anlegen“ tippen'); }
    catch(err){ toast(err.message, true); }
  }
});

/* ================= Start & Abgleich ================= */
function busy(){
  if($('#modal').style.display==='block' || $('#picker').style.display==='block') return true;
  const ae=document.activeElement;
  if(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && ae.closest('#view')) return true;
  if(tab==='neu' && (newNr!=null || ($('#f_buyer')&&$('#f_buyer').value.trim()))) return true;
  if(tab==='mehr' && [...document.querySelectorAll('#calc input')].some(i=>i.type!=='file'&&i.value.trim()!=='')) return true;
  if(tab==='mehr' && pendingImg.calc) return true;
  return false;
}
async function poll(){
  if(saving) return;
  try{
    const txt=await call('getState');
    if(!live){ live=true; setStatus(); }
    if(dirty){ flush(); return; }
    if(!txt) return;
    const x=JSON.parse(txt);
    if(!x||!x.orders||(x.rev||0)<=(S.rev||0)) return;
    if(busy()) return;
    adopt(x); render();
  }catch(e){ if(live){ live=false; setStatus(); } }
}
async function init(){
  document.body.classList.toggle('nl', /netlify\.app$/.test(location.hostname)); // Platz für den Netlify-Hinweis unten
  let local=null, lbase=null;
  try{ local=JSON.parse(localStorage.getItem(LKEY)||'null'); lbase=JSON.parse(localStorage.getItem(LKEY+'-base')||'null'); }catch(e){}
  const unsaved = !!(local && local.orders && lbase && !same(local,lbase)); // Änderungen, die z. B. offline nicht mehr gespeichert wurden
  S=normalize((local&&local.orders)?local:defaults());
  if(lbase) BASE=lbase;
  render();
  try{
    const txt=await call('getState');
    live=true;
    if(txt){
      const remote=normalize(JSON.parse(txt));
      if(unsaved){ S=mergeState(BASE, S, remote); setBase(remote); saveLocal(); dirty=true; flush(); }
      else adopt(remote);
      if((S.appBuild||0)<APP_BUILD){ dirty=true; flush(); }   // neuere Version einmalig bekannt machen
    }
    else {
      // Tabelle leer: allererstes Laden → Startdaten schreiben (Server schreibt nur, wenn noch nichts gespeichert ist)
      S.rev=0;
      const r=await call('saveState', JSON.stringify(S), 0);
      if(r&&r.ok) S.rev=r.rev; else if(r&&r.conflict) adopt(JSON.parse(r.state));
      saveLocal();
    }
  }catch(e){ live=false; toast('Gemeinsame Tabelle nicht erreichbar. Anzeige aus lokaler Kopie.', true); }
  render();
  setInterval(poll, POLL_MS);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) poll(); });
}
init();
</script>
