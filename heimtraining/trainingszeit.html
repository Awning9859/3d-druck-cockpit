:root {
  color-scheme: light;
  --bg: #F8F6F0;
  --card: #ffffff;
  --mint: #DCE7DE;
  --mint-2: #EEF4EF;
  --ink: #163C39;
  --ink-2: #163C39;
  --muted: #5B6B67;
  --line: #E2E6E0;
  --accent: #BC583B;
  --accent-soft: #F6E4DC;
  --ok: #2F6B45;
  --ok-bg: #DDEEDF;
  --warn: #9a5b00;
  --warn-bg: #fbeed6;
  --bad: #a3282b;
  --bad-bg: #f9e1e1;
  --radius: 24px;
  --gap: 18px;
  --shadow: 0 1px 2px rgba(15, 59, 53, .06), 0 6px 18px rgba(15, 59, 53, .06);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.4;
  -webkit-text-size-adjust: 100%; min-height: 100vh;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 520px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; height: 48px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 14px; display: grid; place-items: center; color: var(--ink); }
.icon-btn:active { background: var(--mint); }
svg.i { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
h1 { font-size: 34px; line-height: 1.1; margin: 22px 0 4px; letter-spacing: -.6px; font-weight: 800; }
.date { color: var(--muted); font-size: 15px; margin-bottom: 20px; }
h2.section { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 26px 4px 12px; font-weight: 700; }
.card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
.hero { background: var(--mint); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.hero .art { height: 210px; background: linear-gradient(160deg, #cfe3d9 0%, #e7f0eb 60%, #f3e7d9 100%); position: relative; }
.hero .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .body { padding: 16px 18px 18px; }
.hero h3 { font-size: 26px; margin: 0 0 10px; letter-spacing: -.3px; }
.meta { display: flex; align-items: center; gap: 10px; color: var(--ink-2); margin: 6px 0; font-size: 16px; }
.meta svg.i { width: 20px; height: 20px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; border: 0; border-radius: 20px; letter-spacing: .2px; background: var(--ink); color: #fff; font-weight: 700; font-size: 17px; padding: 12px 16px; margin-top: 14px; }
.btn:disabled { opacity: .45; }
.btn.light { background: var(--card); color: var(--ink); border: 1.5px solid var(--ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { min-height: 42px; font-size: 15px; width: auto; margin-top: 0; padding: 8px 14px; border-radius: 14px; }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--ink); border-radius: 999px; padding: 9px 16px; font-weight: 600; font-size: 15px; background: transparent; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: middle; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.mute { background: #ececec; color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 14px; }
.list-item { display: flex; align-items: center; gap: 12px; background: var(--mint); border-radius: 20px; padding: 16px 16px; margin-bottom: 10px; border: 0; width: 100%; text-align: left; }
.list-item:active { filter: brightness(.97); }
.list-item .ico { width: 40px; height: 40px; border-radius: 12px; background: #fff; display: grid; place-items: center; flex: none; }
.list-item.done { background: var(--mint-2); }
.list-item.done .title { color: var(--muted); }
.title { font-weight: 700; font-size: 17px; }
.week-nav { display: flex; align-items: center; justify-content: space-between; background: var(--mint); border-radius: 18px; padding: 6px; margin-bottom: 14px; }
.week-nav strong { font-size: 17px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, .96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); z-index: 20; }
.tabs button { flex: 1; max-width: 160px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 13px; color: var(--muted); padding: 6px 0; border-radius: 14px; }
.tabs button.on { color: var(--accent); font-weight: 700; }
.tabs button.on::after { content: ''; width: 22px; height: 3px; border-radius: 3px; background: var(--accent); }
.tabs button.on svg.i { stroke: var(--accent); }
.seg { display: flex; background: #ebe8e2; border-radius: 16px; padding: 4px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 12px; padding: 10px 6px; font-weight: 600; font-size: 15px; color: var(--muted); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.banner { background: var(--warn-bg); color: #6b3f00; border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; font-size: 15px; }
.banner.bad { background: var(--bad-bg); color: #6e1a1c; }
.banner.ok { background: var(--ok-bg); color: #1d5233; }

/* Satz-Ansicht */
.runner { position: fixed; inset: 0; background: var(--bg); z-index: 40; overflow-y: auto; padding: calc(10px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); }
.runner .inner { max-width: 520px; margin: 0 auto; }
.runner .head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
.runner .head h2 { text-align: center; margin: 0; font-size: 19px; }
.ctx { text-align: center; color: var(--muted); margin: 12px 0 10px; font-size: 15px; }
.progress { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin-bottom: 18px; }
.progress span { height: 8px; border-radius: 8px; background: var(--mint); transition: background .3s; }
.progress span.done { background: var(--ok); }
.progress span.cur { background: var(--accent); }
.progress span.skip { background: #cfcac2; }
.ex-name { font-size: 32px; font-weight: 800; text-align: center; margin: 4px 0 12px; letter-spacing: -.4px; line-height: 1.15; }
.center { display: flex; justify-content: center; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 8px; }
.tile { background: var(--mint); border-radius: 22px; padding: 14px 10px 16px; text-align: center; }
.tile .lbl { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.tile .val { font-size: 30px; font-weight: 800; }
.tile .val small { font-size: 16px; font-weight: 700; }
.tile input { width: 100%; text-align: center; font-size: 30px; font-weight: 800; border: 0; background: transparent; padding: 0; outline: none; }
.tile .adj { display: flex; justify-content: center; gap: 8px; margin-top: 4px; }
.tile .adj button { border: 0; background: #fff; border-radius: 12px; width: 40px; height: 34px; font-size: 18px; font-weight: 700; }
.setdots { text-align: center; color: var(--muted); margin: 14px 0 8px; }
.dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
.dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--mint); }
.dots span.done { background: var(--ok); }
.dots span.cur { background: var(--accent); }
.dots span.skip { background: #cfcac2; }
.timer { background: var(--mint); border-radius: 22px; padding: 14px; text-align: center; margin-top: 12px; }
.timer .big { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; line-height: 1.1; }
.timer .row { justify-content: center; gap: 8px; margin-top: 6px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.actions .btn { margin-top: 0; min-height: 48px; font-size: 15px; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.cues { margin: 10px 0 0; padding-left: 20px; font-size: 15px; color: var(--ink-2); }
.cues li { margin-bottom: 6px; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(10, 30, 27, .35); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 14px 18px calc(22px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(0, 0, 0, .15); }
.sheet .grab { width: 44px; height: 5px; border-radius: 4px; background: #cfcac2; margin: 0 auto 10px; }
.sheet h3 { font-size: 22px; margin: 4px 0 12px; }
.field { margin-bottom: 14px; }
.field label, .field .flbl { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; color: var(--ink-2); }
.field input[type=text], .field input[type=number], .field input[type=time], .field input[type=date], .field select, .field textarea {
  width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; background: #fff; font-size: 17px; min-height: 48px; }
.field textarea { min-height: 80px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 9px 14px; font-weight: 600; font-size: 15px; min-width: 44px; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.warnchip.on { background: var(--accent); border-color: var(--accent); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle input { width: 26px; height: 26px; accent-color: var(--ink); }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 16px; }
.check input { width: 22px; height: 22px; accent-color: var(--ok); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.sets-table { width: 100%; border-collapse: collapse; font-size: 15px; margin: 6px 0 10px; }

<script>

  const TZ = 'Europe/Berlin';
  const SESSION_STATUS = ['geplant', 'begonnen', 'abgeschlossen', 'teilweise', 'abgebrochen', 'verschoben', 'ausgelassen'];
  const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const WEEKDAYS_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

  // ---------- Datum (Europe/Berlin) ----------
  function berlinParts(date) {
    const f = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    const p = {};
    f.formatToParts(date).forEach(x => { p[x.type] = x.value; });

  }

  }

  function mondayOf(dateStr) { const wd = weekdayOf(dateStr); return addDays(dateStr, wd === 0 ? -6 : 1 - wd); }

    const wd = weekdayOf(dateStr);
    return long ? `${WEEKDAYS_LONG[wd]}, ${d}. ${MONTHS[m - 1]}` : `${WEEKDAYS[wd]}, ${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}.`;
  }
  function num(v) { return v == null ? '' : String(v).replace('.', ','); }
  function fmtTime(iso) { return iso ? berlinOf(iso).time : '–'; }

  // ---------- Vorlagen, Ziele, Sätze ----------
  function templateSlots(type) { return (TEMPLATES[type] || { slots: [] }).slots; }

  // Ausgangsziel einer Übung aus der Vorlage (erster Treffer, Alternativen eingeschlossen)
  function defaultTarget(exerciseId) {
    for (const t of Object.values(TEMPLATES)) {
      for (const s of t.slots) {
        if (s.exerciseId === exerciseId) return targetFromSlot(s, false);
        if (s.alternativeId === exerciseId) return targetFromSlot(s, true);
      }
    }
    return { sets: 2, repMin: 8, repMax: 12, goal: 8, weight: null, perSide: false };
  }
  function targetFromSlot(s, alt) {
    const ex = EXERCISES[alt ? s.alternativeId : s.exerciseId];
    const kind = ex.kind;
    const t = {
      sets: alt ? s.altSets : s.sets,
      repMin: alt ? s.altRepMin : s.repMin,
      repMax: alt ? s.altRepMax : s.repMax,
      weight: alt ? s.altWeight : s.weight,
      perSide: !!(ex.perSide || s.perSide),
      kind,
      holdMin: s.holdMin || null, holdMax: s.holdMax || null,
      tempo: null, source: 'vorlage'

    else { t.goal = t.repMin; }
    return t;
  }
  function currentTarget(state, exerciseId) {
    return (state.targets && state.targets[exerciseId]) || defaultTarget(exerciseId);
  }
  function setCount(target) { return target.sets * (target.perSide ? 2 : 1); }

  function makeSets(target) {
    const n = target.sets;
    const sides = target.perSide ? ['links', 'rechts'] : [null];
    const out = [];
    for (const side of sides) {
      for (let i = 0; i < n; i++) {

          weight: target.weight, holdSec: null, rir: null

  }

  // Übungen einer Einheit: slot-basiert. Überschreibungen (Wechsel, Erleichterung) stehen in session.swaps.
  // Vorgaben einer Plan-Zeile (aus PLAN in data.js) als Ziel-Objekt
  function planTarget(e) {
    const ex = EXERCISES[e.id];
    const kind = ex.kind;
    const t = {
      sets: e.sets,
      repMin: e.min != null ? e.min : null,
      repMax: e.max != null ? e.max : null,
      weight: e.weight != null ? e.weight : null,
      perSide: !!(e.perSide || ex.perSide),
      kind, tempo: e.tempo || null, note: e.note || null,
      holdMin: e.hmin || null, holdMax: e.hmax || null,
      source: 'plan'
    };

    return t;
  }

  function planEntry(planN) {
    return D.PLAN ? D.PLAN.find(p => p.n === planN) || null : null;
  }

  function buildExercises(state, type, planN) {
    const plan = planN ? planEntry(planN) : null;
    if (plan) {
      return plan.ex.map(e => {
        const target = planTarget(e);
        return {
          slotId: EXERCISES[e.id].group, exerciseId: e.id, originalExerciseId: e.id, substituted: false,
          status: 'offen', note: e.note || '', pain: false, technique: null, rir: null, effort: null,
          target, sets: makeSets(target)

      // Erleichterte Übung ersetzt die Vorlage für künftige Einheiten (bis rückgängig gemacht)
      const repl = state.targets && state.targets[slot.exerciseId] && state.targets[slot.exerciseId].replacedBy;
      const exerciseId = repl || slot.exerciseId;
      const target = repl ? defaultTarget(repl) : currentTarget(state, exerciseId);
      return {
        slotId: slot.slot, exerciseId, originalExerciseId: exerciseId, substituted: false,
        status: 'offen', note: '', pain: false, technique: null, rir: null, effort: null,
        target: { ...target, goal: target.goal },
        sets: makeSets(target)
      };
    });
  }

  function estimateMinutes(type) {
    if (type === 'cardio') return 32;
    const ex = templateSlots(type);
    const sets = ex.reduce((a, s) => a + s.sets * (s.perSide ? 2 : 1), 0);
    const perSet = 40 / 60 + 75 / 60; // Arbeit ca. 40 s, Pause 75 s
    return Math.round(7 + sets * perSet + 2);
  }

  // ---------- Sitzungen ----------
  function sessionId(date, kind) { return `s-${date}-${kind}`; }
  function newSession(date, kind, extra) {
    return Object.assign({
      id: sessionId(date, kind), date, type: kind, status: 'geplant',
      plannedTime: null, startedAt: null, endedAt: null, effort: null, feeling: null,
      pain: { knee: false, leftHand: false }, notes: '', exercises: [], swaps: {},
      source: 'plan', calendar: null
    }, extra || {});
  }

  function lastCompletedStrength(sessions) {
    const done = sessions.filter(s => s.status === 'abgeschlossen' && (s.type === 'A' || s.type === 'B'));
    done.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    return done[done.length - 1] || null;
  }
  // Anker ist die zuletzt abgeschlossene Krafteinheit. Eine begonnene, offene Einheit verschiebt
// die Planung für die Folgetage, damit A/B nicht doppelt geplant wird.
  function nextStrengthType(sessions) {
    const anchors = sessions
      .filter(s => (s.type === 'A' || s.type === 'B') && (s.status === 'abgeschlossen' || s.status === 'begonnen'))
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    const last = anchors[anchors.length - 1];
    if (!last) return 'A';
    return last.type === 'A' ? 'B' : 'A';
  }

  // Terminfenster aus den Einstellungen (Mi/Fr 16 Uhr, Ausdauer optional am Wochenende)
  function planSlots(settings, today, days) {
    const slots = [];
    for (let d = today, i = 0; i < days; i++, d = addDays(d, 1)) {
      const wd = weekdayOf(d);
      settings.slots.forEach(s => { if (s.weekday === wd) slots.push({ date: d, kind: 'strength', time: s.time }); });
      if (settings.cardio && settings.cardio.weekday === wd && settings.cardio.optional) {
        slots.push({ date: d, kind: 'cardio', time: settings.cardio.time });
      }
    }
    slots.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    return slots;
  }

  // Plan für die nächsten Tage: fehlende Einheiten als geplant anlegen (idempotent)
  function ensurePlan(state, today, days) {
    days = days || 28;
    const slots = planSlots(state.settings, today, days);
    let next = nextStrengthType(state.sessions);
    for (const slot of slots) {
      if (slot.kind === 'strength') {
        // Vorhandene Krafteinheit an diesem Tag (z. B. begonnen oder verschoben) bleibt erhalten
        const ex = state.sessions.find(s => (s.planDate || s.date) === slot.date && (s.type === 'A' || s.type === 'B'));

        next = next === 'A' ? 'B' : 'A';
      } else {
        const id = sessionId(slot.date, 'cardio');
        if (!state.sessions.find(s => s.id === id)) {
          state.sessions.push(newSession(slot.date, 'cardio', { id, plannedTime: slot.time, source: 'plan' }));
        }
      }
    }
    state.sessions.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    reassignStrengthTypes(state, today);
    return state;
  }

  // Künftige, noch geplante Krafteinheiten wechseln A/B ab, beginnend nach der letzten Einheit mit Fortschritt
  // (abgeschlossen oder begonnen). Hat die Einheit abweichend (z. B. B statt A) stattgefunden, folgt der Plan dem.
  function reassignStrengthTypes(state, today) {
    let next = nextStrengthType(state.sessions);
    const future = state.sessions
      .filter(s => s.source === 'plan' && !s.planN && s.status === 'geplant' && (s.type === 'A' || s.type === 'B') && s.date >= today)
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    for (const s of future) { s.type = next; next = next === 'A' ? 'B' : 'A'; }

  }

    let id = `s-${date}-${type}-${source}`;
    let n = 2;
    while (state.sessions.some(s => s.id === id)) id = `s-${date}-${type}-${source}${n++}`;
    const s = newSession(date, type, { id, source, status: 'geplant', plannedTime: null });
    state.sessions.push(s);
    state.sessions.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

  }

  // Momentaufnahme der künftigen Planung: Reihenfolge und Ziele je Einheit
  function planSnapshot(state, today) {
    const out = {};
    state.sessions
      .filter(s => s.status === 'geplant' && (s.type === 'A' || s.type === 'B') && s.date >= today)
      .forEach(s => {
        out[s.id] = {
          date: s.date, type: s.type,
          exercises: buildExercises(state, s.type).map(e => ({ id: e.exerciseId, goal: e.target.goal, weight: e.target.weight, sets: e.target.sets }))
        };

  }

  // Unterschiede zwischen zwei Momentaufnahmen, mit dem letzten Grund je Übung
  function diffPlans(prev, next, adjustments) {
    const lines = [];
    const reasonFor = exId => {
      const a = (adjustments || []).filter(x => x.exerciseId === exId && !x.undone).pop();
      return a ? a.reason : null;
    };
    const nameOf = id => (EXERCISES[id] || { name: id }).name;
    for (const id of Object.keys(next)) {
      const n = next[id];
      const p = prev && prev[id];
      const when = fmtDate(n.date, false);
      if (!p) { lines.push({ kind: 'neu', text: `${when}: ${KIND_LABEL[n.type]} neu im Plan` }); continue; }
      if (p.type !== n.type) {
        lines.push({ kind: 'reihenfolge', text: `${when}: ${KIND_LABEL[p.type]} wird ${KIND_LABEL[n.type]}, weil sich die letzte abgeschlossene Krafteinheit geändert hat.` });
        continue;
      }
      for (const e of n.exercises) {
        const pe = p.exercises.find(x => x.id === e.id);
        if (!pe) { lines.push({ kind: 'uebung', text: `${when}: ${nameOf(e.id)} neu in ${KIND_LABEL[n.type]}` }); continue; }
        if (pe.goal !== e.goal || pe.weight !== e.weight) {
          const w = pe.weight !== e.weight ? `, ${num(pe.weight)} kg → ${num(e.weight)} kg` : '';
          lines.push({ kind: 'ziel', exerciseId: e.id, text: `${nameOf(e.id)} (${when}): ${pe.goal} → ${e.goal} Wdh.${w}`, reason: reasonFor(e.id) });
        }

    }

  }

  // Ablauf einer Einheit beim Start: Ziele werden aus dem aktuellen Verlauf übernommen
  function startSession(state, session, nowIso, pain) {
    if (session.status === 'geplant' || session.status === 'verschoben' || !session.exercises.length) {

    }

    session.startedAt = session.startedAt || nowIso;
    if (pain) session.pain = { knee: !!pain.knee, leftHand: !!pain.leftHand };
    if (pain && pain.feeling != null) session.feeling = pain.feeling;
    return session;
  }

  function nextSetIndex(ex) { return ex.sets.findIndex(s => s.status === 'offen'); }

  // Aktuelle Position: erste Übung mit offenem Satz
  function currentPosition(session) {
    for (let e = 0; e < session.exercises.length; e++) {

      if (i >= 0) return { ex: e, set: i };
    }
    return null;
  }

  function logSet(session, exIdx, setIdx, values) {
    const ex = session.exercises[exIdx];
    const s = ex.sets[setIdx];
    if (!s) return session;
    Object.assign(s, { status: 'erledigt', reps: nullable(values.reps), weight: nullable(values.weight), holdSec: nullable(values.holdSec) });

    updateExerciseStatus(ex);
    return session;
  }

    const ex = session.exercises[exIdx];
    ex.sets[setIdx].status = 'übersprungen';
    updateExerciseStatus(ex);
    return session;
  }
  function reopenSet(session, exIdx, setIdx) {
    const ex = session.exercises[exIdx];
    ex.sets[setIdx].status = 'offen';
    updateExerciseStatus(ex);
    return session;
  }
  function nullable(v) { return v === '' || v === undefined || v === null || Number.isNaN(v) ? null : v; }
  function updateExerciseStatus(ex) {
    const st = ex.sets.map(s => s.status);
    if (st.every(x => x === 'erledigt')) ex.status = 'erledigt';
    else if (st.every(x => x === 'offen')) ex.status = 'offen';
    else if (st.includes('übersprungen') && !st.includes('offen') && !st.includes('erledigt')) ex.status = 'übersprungen';
    else ex.status = 'teilweise';
  }

  // Übung wechseln oder erleichtern: nur diese Übung, Sätze bleiben, gelöschte Ergebnisse werden nicht übernommen
  function swapExercise(session, exIdx, newExerciseId, target) {
    const ex = session.exercises[exIdx];
    if (ex.sets.some(s => s.status === 'erledigt')) return { ok: false, reason: 'Bereits erledigte Sätze bleiben bei der alten Übung.' };
    const t = target || currentTarget({ targets: {} }, newExerciseId);
    ex.exerciseId = newExerciseId;
    ex.substituted = newExerciseId !== ex.originalExerciseId;
    ex.target = { ...t };
    ex.sets = makeSets(t);
    ex.status = 'offen';
    return { ok: true };
  }

  function skipExercise(session, exIdx) {
    const ex = session.exercises[exIdx];
    ex.sets.forEach(s => { if (s.status === 'offen') s.status = 'übersprungen'; });
    updateExerciseStatus(ex);
    return session;
  }

  // Abschluss: Status ergibt sich aus den Sätzen, fehlende Angaben bleiben null
  function completeSession(session, data) {
    const all = session.exercises.flatMap(e => e.sets);
    const done = all.filter(s => s.status === 'erledigt').length;
    if (all.length && done === all.length) session.status = 'abgeschlossen';
    else if (done > 0) session.status = 'teilweise';
    else session.status = 'abgebrochen';
    session.endedAt = data && data.endedAt !== undefined ? data.endedAt : (session.endedAt || null);
    if (data && data.startedAt !== undefined && data.startedAt !== null) session.startedAt = data.startedAt;
    session.effort = data && data.effort !== undefined ? nullable(data.effort) : session.effort;
    session.feeling = data && data.feeling !== undefined ? nullable(data.feeling) : session.feeling;
    if (data && typeof data.notes === 'string') session.notes = data.notes;
    return session;
  }

  // ---------- Anpassung ----------
  // Regeln (siehe README):
  // R1 Grundlage: schlechtester abgeschlossener Satz einer Übung. Übersprungene Sätze zählen nicht.
  // R2 Unter dem Bereich: Ziel = min(Bereichsminimum, letzte Wdh. + 1), gilt automatisch.
  // R3 Reserve >= 4 Wdh., gute Technik, kein Schmerz, im Bereich: Ziel + 1 (bei Reserve >= 5: + 2), gilt automatisch.
  // R4 Oberes Ende erreicht, Reserve <= 3, gute Technik, kein Schmerz: nur Vorschlag (nächste Stufe), wird bestätigt.
  // R5 Schmerz oder unsichere Technik: keine Steigerung, Vorschlag zum Erleichtern.
  // R6 Erste Messung einer Übung ist nur Ausgangspunkt, keine Änderung. Fehlende Angaben ändern nichts.
  // R7 Jede Übung wird nur anhand ihres eigenen Verlaufs geändert. Gesamtanstrengung wird nicht verwendet.
  function hasPreviousData(sessions, exerciseId, excludeId) {
    return sessions.some(s => s.id !== excludeId && s.status !== 'geplant' && s.status !== 'begonnen' &&
      s.exercises.some(e => e.exerciseId === exerciseId && e.sets.some(x => x.status === 'erledigt')));
  }

  // Hinweis, wenn für diese Übung ein neues Gewicht nötig werden kann (nur mit deinen vorhandenen Geräten)
  function gearHintFor(exerciseId, weight) {
    const ex = EXERCISES[exerciseId] || {};
    if (!ex.equipment) return null;
    if (ex.equipment.includes('kettlebell') && weight === 8) {
      return 'Mit der 8-kg-Kettlebell ist der Reiz ausgeschöpft. Bevor du weiter steigerst, brauchst du eine schwerere Kettlebell (z. B. 12 kg). Erst kaufen, wenn Tempo und Pausen nicht mehr reichen.';
    }
    if (ex.equipment.includes('dumbbell') && weight === 2.5) {
      return 'Mit den 2,5-kg-Kurzhanteln ist der Reiz ausgeschöpft. Bevor du weiter steigerst, brauchst du schwerere Kurzhanteln (z. B. 4 kg je Hand). Erst kaufen, wenn Tempo und Pausen nicht mehr reichen.';
    }
    return null;
  }

  // Vorschlag für die nächste Einheit aus dem Ergebnis einer Plan-Einheit. Nichts wird automatisch geändert.
  function planSuggestions(session) {
    const out = [];
    for (const ex of session.exercises) {
      const t = ex.target || {};
      const done = ex.sets.filter(x => x.status === 'erledigt');
      if (!done.length || t.kind === 'check') continue;
      const name = (EXERCISES[ex.exerciseId] || { name: ex.exerciseId }).name;
      if (t.kind === 'hold') {
        const vals = done.map(x => x.holdSec).filter(v => v != null);
        if (vals.length && Math.min(...vals) >= t.holdMax) out.push(`${name}: Haltezeit um 10 Sek. verlängern.`);
        continue;
      }
      const reps = done.map(x => x.reps).filter(v => v != null);
      if (!reps.length || t.repMax == null) continue;
      if (Math.min(...reps) >= t.repMax && t.tempo) {
        // Tempo ist schon im Plan: der Reiz mit diesem Gewicht ist weitgehend ausgeschöpft
        const hint = gearHintFor(ex.exerciseId, t.weight);
        if (hint) out.push(`Gerätehinweis: ${name}. ${hint}`);
      }
      if (Math.min(...reps) >= t.repMax) {
        out.push(`${name}: oberes Ende ${t.repMax} Wdh. geschafft. Nächstes Mal Tempo, dann kürzere Pausen. Gewicht nur bei passender Reserve.`);
      } else if (Math.min(...reps) < t.repMin) {
        out.push(`${name}: unter dem Ziel (${t.repMin}–${t.repMax} Wdh.). Gewicht bleibt, nächstes Mal wieder anpeilen.`);
      }
    }
    return out;
  }

  function adjustFromSession(state, session, nowIso) {
    if (session.planN) return { changes: [], proposals: [], suggestions: planSuggestions(session) };
    const changes = [];
    const proposals = [];
    for (const ex of session.exercises) {
      const done = ex.sets.filter(s => s.status === 'erledigt');
      if (!done.length) continue;
      const t = currentTarget(state, ex.exerciseId);
      const known = hasPreviousData(state.sessions, ex.exerciseId, session.id);
      const exDef = EXERCISES[ex.exerciseId];
      const painHit = (session.pain.knee && exDef.knee) || (session.pain.leftHand && exDef.grip) || ex.pain;
      const badTech = ex.technique === 'unsicher';
      const easier = exDef.easier;
      if (painHit || badTech) {
        if (easier) proposals.push({ exerciseId: ex.exerciseId, type: 'leichter', label: `Leichter: ${EXERCISES[easier].name}`, change: { exerciseId: easier } });
        continue;
      }
      if (!known) continue; // R6

      if (t.kind === 'hold') {
        const vals = done.map(s => s.holdSec).filter(v => v != null);
        if (!vals.length) continue;
        const worst = Math.min(...vals);
        const cur = t.holdGoal || t.holdMin;
        if (worst < cur) continue;
        if (worst >= (t.holdMax || cur)) {
          proposals.push({ exerciseId: ex.exerciseId, type: 'stufe', label: 'Haltezeit um 10 Sekunden verlängern', change: { holdGoal: (t.holdMax || cur) + 10 } });
        }
        continue;
      }

      const reps = done.map(s => s.reps).filter(v => v != null);
      if (!reps.length) continue; // R6 fehlende Angaben
      const worst = Math.min(...reps);
      const rirVals = done.map(s => s.rir).filter(v => v != null);
      const rir = rirVals.length ? Math.min(...rirVals) : null;
      const goal = t.goal;
      let newGoal = null, reason = null;

      if (worst < t.repMin) {
        newGoal = Math.min(t.repMin, worst + 1);
        reason = `Letzter schlechtester Satz ${worst} Wdh. liegt unter dem Bereich ${t.repMin}–${t.repMax}. Ziel für nächstes Mal: ${newGoal}.`;
      } else if (worst < t.repMax && rir !== null && rir >= 4 && !badTech) {
        const delta = rir >= 5 ? 2 : 1;
        newGoal = Math.min(t.repMax, worst + delta);
        reason = `Reserve ${rir >= 5 ? '5+' : rir} Wdh., Technik gut, kein Schmerz: Ziel für nächstes Mal ${newGoal} Wdh. (im Bereich ${t.repMin}–${t.repMax}).`;
      } else if (worst >= t.repMax && rir !== null && rir <= 3) {
        const stage = nextStage(ex.exerciseId, t);
        if (stage) proposals.push({ exerciseId: ex.exerciseId, type: 'stufe', label: stage.label, change: stage.change, reason: `Oberes Ende ${t.repMax} Wdh. erreicht, Reserve ${rir}.` });
      }

      if (newGoal !== null && newGoal !== goal) {
        const before = snapshotTarget(t);
        const after = { ...t, goal: newGoal };
        state.targets[ex.exerciseId] = after;
        const adj = { id: `adj-${Date.now()}-${ex.exerciseId}`, date: session.date, at: nowIso, exerciseId: ex.exerciseId, before, after, reason, undone: false, auto: true };
        state.adjustments.push(adj);
        changes.push(adj);
      }
    }
    proposals.forEach(p => { state.proposals = state.proposals || []; state.proposals.push({ ...p, sessionId: session.id, open: true }); });
    return { changes, proposals, suggestions: [] };
  }

  function snapshotTarget(t) { return JSON.parse(JSON.stringify(t)); }

  function nextStage(exerciseId, t) {
    const ex = EXERCISES[exerciseId];
    return (ex.stages || [])[0] || null;
  }

  // Vorschlag bestätigen (Gewicht, Tempo, Variante). Nur diese Übung wird geändert.
  function acceptProposal(state, proposal, nowIso) {
    const t = currentTarget(state, proposal.exerciseId);
    const before = snapshotTarget(t);
    let after;
    if (proposal.type === 'leichter') {
      after = { ...t, replacedBy: proposal.change.exerciseId, source: 'erleichtert' };
      state.targets[proposal.exerciseId] = after;
    } else {
      after = { ...t, ...(proposal.change.weight != null ? { weight: proposal.change.weight } : {}), ...(proposal.change.tempo ? { tempo: proposal.change.tempo } : {}), goal: t.repMin, holdGoal: proposal.change.holdGoal || t.holdGoal, source: 'bestätigt' };
      state.targets[proposal.exerciseId] = after;
    }
    state.adjustments.push({ id: `adj-${Date.now()}-${proposal.exerciseId}`, date: nowIso.slice(0, 10), at: nowIso, exerciseId: proposal.exerciseId, before, after, reason: proposal.label, undone: false, auto: false });
    proposal.open = false;
    return state;
  }

  function undoAdjustment(state, adjId) {
    const adj = state.adjustments.find(a => a.id === adjId);
    if (!adj || adj.undone) return state;
    state.targets[adj.exerciseId] = adj.before;
    adj.undone = true;
    return state;
  }

  // ---------- Verlauf ----------
  // Verlauf einer Übung: je abgeschlossener Einheit der schlechteste Satz und die Last
  function exerciseHistory(sessions, exerciseId) {
    return sessions
      .filter(s => s.status !== 'geplant' && s.status !== 'begonnen')
      .flatMap(s => s.exercises.filter(e => e.exerciseId === exerciseId).map(e => {
        const done = e.sets.filter(x => x.status === 'erledigt');
        const reps = done.map(x => x.reps).filter(v => v != null);
        const holds = done.map(x => x.holdSec).filter(v => v != null);
        const weights = done.map(x => x.weight).filter(v => v != null);
        return {
          date: s.date, sessionId: s.id, status: s.status,
          sets: done.length, planned: e.sets.length,
          worstReps: reps.length ? Math.min(...reps) : null,
          worstHold: holds.length ? Math.min(...holds) : null,
          weight: weights.length ? Math.max(...weights) : null,
          summary: done.length ? `${done.length}× ${reps.length ? Math.min(...reps) : '–'}${weights.length ? ' · ' + Math.max(...weights) + ' kg' : ''}` : 'keine Sätze erfasst'
        };
      })).sort((a, b) => (a.date < b.date ? -1 : 1));
  }

  // ---------- Kalender-Vorschau (rein) ----------
  // Addiert Minuten auf eine Wand-Uhr-Zeit (ohne Zeitzone, Sommerzeit spielt hier keine Rolle)
  function addMinutesLocal(local, minutes) {
    const [datePart, timePart] = local.split('T');
    const [y, m, d] = datePart.split('-').map(Number);
    const [hh, mm] = timePart.split(':').map(Number);
    const t = new Date(Date.UTC(y, m - 1, d, hh, mm + minutes));
    const pad = n => String(n).padStart(2, '0');
    return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}T${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())}:00`;
  }
  function calendarEventId(sessionIdStr) { return 'ht' + sessionIdStr.toLowerCase().replace(/[^a-v0-9]/g, ''); }
  const KIND_LABEL = { A: 'Krafttraining A', B: 'Krafttraining B', cardio: 'Ausdauer (optional)' };

  function eventBody(session) {
    if (!session.plannedTime && !session.startedAt) return null; // Termin offen: nicht eintragen
    const dur = session.type === 'cardio' ? 32 : 40;
    let startLocal, endLocal;
    const dateStr = session.date;
    if (session.startedAt) startLocal = berlinLocal(session.startedAt);
    else startLocal = `${dateStr}T${session.plannedTime}:00`;
    if (session.endedAt) endLocal = berlinLocal(session.endedAt);
    else endLocal = addMinutesLocal(startLocal, dur);
    const label = KIND_LABEL[session.type] || 'Training';
    let title = label, statusText = 'geplant';
    if (session.status === 'abgeschlossen') { title = `✓ ${label}`; statusText = 'abgeschlossen'; }
    else if (session.status === 'teilweise') { title = `◐ ${label} (teilweise)`; statusText = 'teilweise absolviert'; }
    else if (session.status === 'abgebrochen') { title = `✕ ${label} (abgebrochen)`; statusText = 'abgebrochen'; }
    else if (session.status === 'begonnen') { title = `${label} (läuft)`; statusText = 'begonnen'; }
    return {
      id: calendarEventId(session.id),
      summary: title,
      description: `Status: ${statusText}. Details bleiben in der Trainings-App.`,
      start: { dateTime: startLocal, timeZone: TZ },
      end: { dateTime: endLocal, timeZone: TZ }
    };
  }

  // ---------- Kalender-Export als .ics (kostenlos, ohne Google-Anbindung) ----------
  // Jede Einheit bekommt eine feste UID. Wird dieselbe Datei erneut importiert,
  // erkennt ein Kalender-Programm den Termin anhand der UID.
  function icsStamp(iso) { return new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
  function icsEscape(t) { return String(t).replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
  function icsFold(line) {
    // Zeilen höchstens 60 Zeichen lang halten (Mehrbyte-Zeichen sicher innerhalb 75 Oktette)
    const out = []; let rest = line;
    while (rest.length > 60) { out.push(rest.slice(0, 60)); rest = ' ' + rest.slice(60); }
    out.push(rest);
    return out.join('\r\n');
  }
  // Zeitraum einer Einheit als UTC-Zeitpunkte
  function sessionSpanIso(s) {
    const start = s.startedAt || (s.plannedTime ? berlinIso(s.date, s.plannedTime) : null);
    if (!start) return null;
    const dur = s.type === 'cardio' ? 32 : 40;
    const end = s.endedAt || new Date(Date.parse(start) + dur * 60000).toISOString();
    return { start, end };
  }
  // Aufgenommen werden geplante Einheiten und spontane/nachgetragene nur, wenn du sie ausdrücklich wählst.
  // Ausgelassene Einheiten fehlen in der Datei; sie aus einem früheren Import bitte von Hand löschen.
  function icsEvents(state) {
    const out = [];
    for (const s of state.sessions) {
      if (s.status === 'ausgelassen') continue;
      if (!(s.source === 'plan' || s.calendarOptIn === true)) continue;
      const body = eventBody(s);
      const span = sessionSpanIso(s);
      if (!body || !span) continue;
      out.push({ uid: `${body.id}@trainingszeit`, summary: body.summary, description: body.description, start: span.start, end: span.end });
    }
    return out;
  }
  function icsCalendar(state, nowIso) {
    const stamp = icsStamp(nowIso);
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Trainingszeit//Heimtraining//DE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Heimtraining'];
    for (const e of icsEvents(state)) {
      lines.push('BEGIN:VEVENT', `UID:${e.uid}`, `DTSTAMP:${stamp}`, `DTSTART:${icsStamp(e.start)}`, `DTEND:${icsStamp(e.end)}`,
        `SUMMARY:${icsEscape(e.summary)}`, `DESCRIPTION:${icsEscape(e.description)}`, 'STATUS:CONFIRMED', 'TRANSP:OPAQUE', 'END:VEVENT');
    }
    lines.push('END:VCALENDAR');
    return lines.map(icsFold).join('\r\n') + '\r\n';
  }

  // ---------- Import / Export ----------
  const EXPORT_VERSION = 1;
  function exportPayload(state, nowIso) {
    return {
      app: 'heimtraining', version: EXPORT_VERSION, exportedAt: nowIso,
      data: { sessions: state.sessions, targets: state.targets, adjustments: state.adjustments, settings: state.settings, media: state.media || {} }
    };
  }
  function validateImport(obj) {
    const errors = [];
    if (!obj || obj.app !== 'heimtraining') errors.push('Keine Trainingsdatei (app fehlt oder falsch).');
    if (obj && obj.version !== EXPORT_VERSION) errors.push(`Version ${obj && obj.version} wird nicht unterstützt.`);
    const d = obj && obj.data;
    if (!d || typeof d !== 'object') errors.push('Datenteil fehlt.');
    else {
      if (!Array.isArray(d.sessions)) errors.push('sessions ist keine Liste.');
      else d.sessions.forEach((s, i) => {
        if (!s || typeof s.id !== 'string') errors.push(`Einheit ${i + 1}: id fehlt.`);
        if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s.date || '')) errors.push(`Einheit ${i + 1}: Datum ungültig.`);
        if (!s || !SESSION_STATUS.includes(s.status)) errors.push(`Einheit ${i + 1}: Status ungültig.`);
        if (s && !Array.isArray(s.exercises)) errors.push(`Einheit ${i + 1}: exercises fehlt.`);
      });
      if (d.targets && typeof d.targets !== 'object') errors.push('targets ungültig.');
      if (d.adjustments && !Array.isArray(d.adjustments)) errors.push('adjustments ungültig.');
    }
    return { ok: errors.length === 0, errors };
  }
  function importPayload(obj) {
    const v = validateImport(obj);
    if (!v.ok) return { ok: false, errors: v.errors };
    const d = obj.data;
    return { ok: true, state: {
      sessions: d.sessions, targets: d.targets || {}, adjustments: d.adjustments || [],
      settings: Object.assign(JSON.parse(JSON.stringify(SETTINGS_DEFAULT)), d.settings || {}), proposals: [], media: d.media || {}
    } };
  }

  // Nach einer Änderung der Trainingszeiten: geplante, noch nicht begonnene Termine in der Zukunft,
  // die nicht mehr zum Plan gehören, entfernen. Mit Kalendertermin werden sie als ausgelassen markiert,
  // damit der Termin beim nächsten Eintragen gelöscht wird.
  function pruneFuturePlanned(state, today, days) {
    days = days || 28;
    const end = addDays(today, days - 1);
    const slots = planSlots(state.settings, today, days);
    const isPlanned = s => s.source === 'plan' && s.status === 'geplant' && s.date >= today && s.date <= end;
    state.sessions = state.sessions.filter(s => {
      if (!isPlanned(s)) return true;
      const isStrength = s.type === 'A' || s.type === 'B';
      const slotExists = slots.some(x => x.date === (s.planDate || s.date) && (x.kind === 'strength') === isStrength);
      if (slotExists) return true;
      if (s.calendar && s.calendar.eventId) { s.status = 'ausgelassen'; return true; }
      return false;
    });
    return state;
  }

  // Berlin-Zeit (Datum + HH:MM) in ISO-Zeitpunkt umrechnen, Sommer- und Winterzeit beachten
  function berlinIso(date, time) {
    for (const off of ['+01:00', '+02:00']) {
      const iso = new Date(`${date}T${time}:00${off}`).toISOString();
      const p = berlinOf(iso);
      if (p.date === date && p.time === time) return iso;
    }
    return new Date(`${date}T${time}:00+01:00`).toISOString();
  }

  // Die sieben Plan-Einheiten als geplante Termine (mit fester Nummer und Startzeit 16:00)
  function planSessions() {
    return (D.PLAN || []).map(p => newSession(p.date, p.type, {
      id: sessionId(p.date, p.type), planN: p.n, plannedTime: '16:00', source: 'plan', status: 'geplant'
    }));
  }

  function initialState() {
    return {
      version: 1,
      sessions: JSON.parse(JSON.stringify(SEED_SESSIONS)).concat(planSessions()),
      targets: {}, adjustments: [], proposals: [],
      settings: JSON.parse(JSON.stringify(SETTINGS_DEFAULT))
    };
  }

  const api = {
    TZ, SESSION_STATUS, WEEKDAYS, WEEKDAYS_LONG, MONTHS,
    todayStr, berlinOf, berlinLocal, addDays, weekdayOf, mondayOf, fmtDate, fmtTime, fmtDuration,
    defaultTarget, currentTarget, setCount, makeSets, buildExercises, estimateMinutes,
    sessionId, newSession, nextStrengthType, lastCompletedStrength, ensurePlan,
    startSession, currentPosition, logSet, skipSet, reopenSet, swapExercise, skipExercise, completeSession, updateExerciseStatus,
    adjustFromSession, acceptProposal, undoAdjustment, exerciseHistory,
    calendarEventId, eventBody, icsCalendar, icsEvents,
    exportPayload, validateImport, importPayload, initialState, templateSlots, KIND_LABEL,
    planSlots, hasPreviousData, pruneFuturePlanned, berlinIso,
    reassignStrengthTypes, createUnplanned, planSnapshot, diffPlans, planSuggestions, planTarget, gearHintFor
  };
  if (typeof module === 'object' && module.exports) module.exports = api;
  root.HT_LOGIC = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Oberfläche. Logik liegt in logic.js. Kalender-Export als .ics, ohne Google-Anbindung. */
(function () {
  'use strict';
  const L = window.HT_LOGIC, D = window.HT_DATA;
  const KEY = 'heimtraining.v1', UIKEY = 'heimtraining.ui.v1';
  const $ = (s, r) => (r || document).querySelector(s);

  let state = null;
  const ui = { route: 'today', open: null, weekStart: null, histTab: 'sessions', histEx: 'kb_deadlift', histSession: null };
  let draft = {};        // ungespeicherte Eingaben im Satz-Bildschirm
  let pre = null;        // Zustand des Vorab-Dialogs
  let sheetEl = null;
  let tick = null;
  let toastTimer = null;
  let lastOk = null;

  // ---------- Grundfunktionen ----------
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function num(v) { return v == null ? '' : String(v).replace('.', ','); }
  function today() { return L.todayStr(new Date()); }
  function nowIso() { return new Date().toISOString(); }
  function byDate(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1); }
  function byDateDesc(a, b) { return -byDate(a, b); }
  function find(id) { return state.sessions.find(s => s.id === id) || null; }

  const ICONS = {
    back: '<path d="M15 18l-6-6 6-6"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    play: '<path d="M7 5v14l12-7z"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    bolt: '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
    skip: '<path d="M5 5l9 7-9 7z"/><path d="M19 5v14"/>',
    swap: '<path d="M7 4v16M7 4l-3 3M7 4l3 3"/><path d="M17 20V4M17 20l-3-3M17 20l3-3"/>',
    alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.5"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
    dumbbell: '<path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/>',
    cloud: '<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1 .5 9z"/><path d="M9 14l2 2 4-4"/>',
    undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',

  };
  function icon(name, cls) { return `<svg class="i ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`; }

  function kettlebellArt() {
    return `<svg viewBox="0 0 400 210" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe3d9"/><stop offset=".6" stop-color="#e7f0eb"/><stop offset="1" stop-color="#f3e7d9"/></linearGradient></defs>
      <rect width="400" height="210" fill="url(#g1)"/>
      <rect x="40" y="168" width="320" height="26" rx="13" fill="#b9d3c6"/>
      <path d="M150 88a50 50 0 0 1 100 0" fill="none" stroke="#2b2f2e" stroke-width="16" stroke-linecap="round"/>
      <circle cx="200" cy="128" r="62" fill="#2b2f2e"/>
      <text x="200" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#e9ece9">8 kg</text>
    </svg>`;
  }
  function cardioArt() {
    return `<svg viewBox="0 0 400 210" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe3d9"/><stop offset="1" stop-color="#f3e7d9"/></linearGradient></defs>
      <rect width="400" height="210" fill="url(#g2)"/>
      <rect x="60" y="150" width="280" height="22" rx="11" fill="#2b2f2e" opacity=".85"/>
      <rect x="40" y="172" width="320" height="12" rx="6" fill="#b9d3c6"/>
      <path d="M170 100 L210 60 L240 90 L270 60" fill="none" stroke="#BC583B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="196" cy="78" r="12" fill="#BC583B"/>
    </svg>`;
  }

  // ---------- Speichern ----------
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch (e) { toast('Speichern ist gerade nicht möglich. Bitte Daten exportieren (Einstellungen).'); return false; }
  }
  function saveUi() { try { localStorage.setItem(UIKEY, JSON.stringify(ui)); } catch (e) { /* ohne Speicher weiter */ } }
  function loadUi() { try { const u = JSON.parse(localStorage.getItem(UIKEY) || 'null'); if (u && typeof u === 'object') Object.assign(ui, u); } catch (e) { /* Standard */ } }
  function loadState() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw) {
      try {
        const s = JSON.parse(raw);
        if (s && s.version === 1 && Array.isArray(s.sessions)) { s.media = s.media || {}; s.targets = s.targets || {}; s.adjustments = s.adjustments || []; s.proposals = s.proposals || []; return s; }
      } catch (e) { /* unten Sicherung */ }
